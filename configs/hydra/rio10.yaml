# Hydra parameters for RIO10 (placeholder, filled in WP1 steps 4–6).
# Start from the upstream hydra_ros dataset config closest to an RGB-D handheld camera
# and override only what differs here.
sensor:
  frame_id: camera
  min_range: 0.1
  max_range: 5.0
odometry:
  source: ground_truth   # supplied mapping poses, no VIO
segmentation:
  model: null            # pretrained model (WP1 step 5)
  label_remapping: null  # path to label→category mapping
output:
  dir: data/maps         # <scene>/dsg.json, mesh
