# RIO10 dataset configuration (verified against scene01).
# Paths are relative to the repository root.
root: data/raw/rio10
mapping_dir: data/raw/rio10/mapping   # reference recordings -> Hydra maps
query_dir: data/raw/rio10/query       # held-out recordings -> RGB localization queries

scenes:
  - id: scene01
    mapping: [seq01_01]
    query: [seq01_02]                 # validation sequence with GT (test GT is held out)

camera:
  intrinsics_source: camera.yaml      # per-sequence YAML inside each sequence folder
  width: 540
  height: 960
  fx: 756.02630615
  fy: 756.83215332
  cx: 270.41879272
  cy: 492.88940430
  depth_scale: 1000.0                 # uint16 millimeters in frame-XXXXXX.rendered.depth.png
  depth_type: rendered                # rendered Z-depth from reconstructed mesh

pose:
  convention: camera-to-world         # 4x4 T_world_cam matrix per frame (frame-XXXXXX.pose.txt)
  format: 4x4 matrix per frame
