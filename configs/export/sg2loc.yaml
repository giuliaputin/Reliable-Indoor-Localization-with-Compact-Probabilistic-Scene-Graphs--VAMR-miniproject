# Hydra -> SG2Loc 3RScan-compatible export configuration (WP1).
# All relative paths are resolved from the repository root.

paths:
  maps_dir: data/maps                       # <map_seq>/backend/{dsg_with_mesh.json,mesh.ply}
  raw_rio10_dir: data/raw/rio10             # mapping/<seq> and query/<seq>
  export_dir: data/exports/sg2loc           # SG2Loc root (contains scenes/ and files/)
  sg2loc_repo: third_party/sg2loc           # Path to SG2Loc repository
  ade20k_label_space: /home/aina/hydra_ws/src/hydra/config/label_spaces/ade20k_full_label_space.yaml

extraction:
  floor_ade20k_label: 3                     # ADE20k 'floor' -> SG2Loc objectId = 1
  min_obj_vertices: 20                      # Discard tiny fragmented object meshes

bvh:
  dir_name: bvh_trees_0.5
  max_triangles_per_leaf: 8

scene_graph:
  pc_resolutions: [64, 128, 256, 512]       # Multi-resolution FPS object point clouds
  default_nyu40_id: 39                      # Fallback: 'otherfurniture'
  vertical_thresh_m: 0.45                   # above / below
  cardinal_max_dist_m: 2.5                  # left / right / front / behind
  close_by_max_dist_m: 3.5                  # close_by vs. none

visual_embeddings:
  dir_name: Features3D/obj_dinov2_top10_l3
  model_name: dinov2_vitg14
  desc_layer: 31
  desc_facet: value
  topk_views: 10
  frame_subsample_step: 5
  crop_levels: 3
  crop_expansion_ratio: 0.2
  rotate_270: true                          # Match SG2Loc's rotated frame convention

ade20k_to_nyu40:
